    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    .box-1{
        width: 200px;
        height: 300px;
        background-color: red;
    }

    .container{
        /* position: relative; */
    }
    .box-2{
        width: 200px;
        height: 300px;
        background-color: green;
        /* position: relative; */
        /* position: fixed; */
        position: sticky;
        /* z-index: 11; */
        top: 30px;
        left: 30px;
    }
    .box-3{
        width: 200px;
        height: 300px;
        background-color: blue;
        z-index: -1;
    }


    :root{
        --bg-color:blue;
        --spacing:40px;
        --justifies:center;

        --bg-b1:red;
        --bg-b2:green;
        --bg-b3:yellow;
        --bg-b4:blue;

        --bg-image:url("./1.jpg")
    }

    .new{
        width: 200px;
        height: 200px;
        background-color: var(--bg-color);
    }

    .series{
        display: flex;
        justify-content: var(--justifies);
        gap: var(--spacing);

        
    }

    .b{
        width: 200px;
        height: 200px;
    }

    .b-1{
        background-color: var(--bg-b1);
    }
    .b-2{
        background-color: var(--bg-b2);
    }
    .b-3{
        background-color: var(--bg-b3);
    }
    .b-4{
        background-color: var(--bg-b4);
    }

    .new1{
        width: 100%;
        height: 300px;
        background-image: linear-gradient(-120deg,red,yellow);
        opacity: 0.9;
    }

    .bg{
        width: 100%;
        height: 400px;
        background-image: var(--bg-image);
    }

    .s{
        justify-content: center;
        display: grid;
        grid-template-columns: 300px 300px 300px 300px 300px;
        grid-template-rows: 250px 250px 250px 250px;

        align-items: center;
        justify-items: center;
    }

    .rc{
        width: 200px;
        height: 200px;
        border: 5px solid black;
    }
</style>
