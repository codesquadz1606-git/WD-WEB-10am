<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <h1>Bird</h1>
        </div>
        <div class="navbar">
            <ul>
                <li>Products</li>
                <li>Pricing</li>
                <li>Customers</li>
                <li>Partners</li>
                <li>Resources</li>
            </ul>
        </div>
        <div class="btns">
            <button class="btn btn1">Get a Demo</button>
            <button class="btn btn2">Log In</button>
        </div>
    </div>

    <div id="main">
        <div class="left-content">
            <div class="content">
                <div class="text">
                    Personalized <span style="color: blue;">Email Marketing</span> Scaled for impact
                </div>

                <div class="para">
                    One unified platform to enhance engagment, increase coversions and growth your revenue.
                </div>

                <div>
                    <input class="email" type="email" placeholder="What's your Email"> <br>
                    <input class="submit" type="submit" value="See Bird">
                </div>
            </div>
        </div>
        <div class="right-content">
            <div class="img-box"></div>
        </div>
    </div>
</body>
</html>
