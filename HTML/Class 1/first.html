<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Class</title>
</head>
<body>
    <!-- Ctrl + / : Comment
        Comment means disable that particular line or code 
    -->

    <!-- 
        Here , we will write anything in <> is considered as a tag , & if we are not using <> it is considered as a text
    -->
    <!-- Hello My name is Ayush -->

    <!-- <h1>Hello</h1> -->

    <!-- Heading Tag : We have 6 types of heading tag -->
    <!-- h1 to h6 : We use these tags , as they pre defined boldness & their own size. -->

    <h1>Ayush</h1>
    <h2>Ayush</h2>
    <h3>Ayush</h3>
    <h4>Ayush</h4>
    <h5>Ayush</h5>
    <h6>Ayush</h6>

    <!-- Media Tags : img , audio & video -->
    <!-- FOr adding the media tag , we have to make a folder where we will add our assets. -->

    <!-- You are in C:Drive         File is in D:Drive -->
    <!-- You have share me that folder -->

    <!-- What is Attribute?
        Attribute is a function that enhance any tag functionality.
        <tagname attribute......></tagname>
    -->

    <!-- Media Tag -->
    <img width="400px" src="assets/Image.png" alt="Something Wrong">
    <audio controls src="assets/Audio.mp3"></audio>
    <video controls width="400px" src="assets/Video.mp4"></video>

    <!-- 
        Inline Tag Vs Block Tag
        Inline tag means it accquire the space according to the content.
        examples : audio , img , video , a , span , b 

        Block Tag means it acquire the whole line space , here content doesn't matter
        examples : p , h1toh6 , li ,......
    -->
</body>
</html>
