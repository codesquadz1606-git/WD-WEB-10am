<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 
        Form tag
        Why we use form tag?
        form tag -> label , input , select , option , textarea,......
    -->

    <form>
        <fieldset>
            <legend align="center">Application Form</legend>
            <label for="fullname">Full Name :</label>
            <input id="fullname" type="text" placeholder="Enter your Full Name">
            <br>
            <label for="">Age : </label>
            <input type="number" placeholder="Enter your Age">
            <br>
            <label for="">Email :</label>
            <input type="email" placeholder="Enter your Email">
            <br>
            <label for="">Gender : </label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br>
            <label for="">Password : </label>
            <input type="password">
            <br>
            <label for="">Date Of Birth :</label>
            <input type="date">
            <br>
            <input type="range">
            <br>
            <label for="">Select Semester : </label>
            <select name="" id="">
                <option value="">Ist Sem</option>
                <option value="">IInd Sem</option>
                <option value="">IIIrd Sem</option>
                <option value="">IVth Sem</option>
                <option value="">Vth Sem</option>
                <option value="">VI Sem</option>
            </select>
            <br>
            <label for="">Select Skills : </label>
            <input type="checkbox">React
            <input type="checkbox">Python
            <input type="checkbox">Java
            <input type="checkbox">C++
            <input type="checkbox">Dot Net
            <input type="checkbox">AI ML
            <br>
            <label for="">Share your feedback : </label>
            <textarea name="" id=""></textarea>
            <br>
            <input type="file">
            <br>
            <input type="submit" value="Apply">
            <input type="reset" value="Delete">

        </fieldset>
    </form>

</body>

</html>
